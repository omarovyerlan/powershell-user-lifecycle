name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = foreach ($path in './src', './scripts') {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Warning, Error
          }
          $issues | Format-Table -Property Severity, RuleName, ScriptName, Line, Message -AutoSize -Wrap
          if ($issues | Where-Object Severity -EQ 'Error') { throw 'PSScriptAnalyzer found errors.' }

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results.xml'
          Invoke-Pester -Configuration $config

      - name: Demo run (dry run + live run)
        shell: pwsh
        run: |
          ./scripts/Start-UserLifecycle.ps1 -WhatIf
          ./scripts/Start-UserLifecycle.ps1

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results.xml
            output/reports/
            output/logs/
